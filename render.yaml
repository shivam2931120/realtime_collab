services:
  - type: web
    name: realtime-collab-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_TOKEN_TTL_SECONDS
        value: "1209600"
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: EMAILJS_FROM_NAME
        value: Editorial
      - key: EMAILJS_REPLY_TO
        sync: false
      - key: EMAILJS_MIN_INTERVAL_MS
        value: "1100"
