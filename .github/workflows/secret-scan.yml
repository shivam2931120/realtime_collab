name: Secret Scan

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [ main ]

jobs:
  trufflehog-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: TruffleHog scan
        uses: marketplacer/trufflehog-action@v1.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
